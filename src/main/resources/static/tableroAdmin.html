<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tablero Admin</title>
    <link rel="stylesheet" href="CSSs/main.css">
    <style>
        html, body { height: 100%; overflow-y: auto; }
        .stats-grilla { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #fff; border-radius: 8px; padding: 12px 14px; border-left: 4px solid #1a3a5c; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
        .stat-label { font-size: .78rem; color: #666; text-transform: uppercase; letter-spacing: .4px; }
        .stat-valor { font-size: 1.2rem; font-weight: 700; color: #1a3a5c; margin-top: 2px; }
        .stat-card.balance-pos .stat-valor { color: #1e8449; }
        .stat-card.balance-neg .stat-valor { color: #c0392b; }
        .nav-jornada { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; background: #fff; padding: 12px 16px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
        .nav-jornada span { font-size: 1.05rem; font-weight: 700; color: #1a3a5c; flex: 1; text-align: center; }
        .btn-nav { background: #1a3a5c; color: #fff; border: none; border-radius: 6px; width: 36px; height: 36px; cursor: pointer; font-size: 1.1rem; }
        .btn-nav:disabled { background: #ccc; cursor: default; }
        .seccion-titulo { font-size: .95rem; font-weight: 700; color: #1a3a5c; text-transform: uppercase; letter-spacing: .5px; margin: 18px 0 8px; border-bottom: 2px solid #d4ac0d; padding-bottom: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: .87rem; }
        th { background: #f0f3f7; color: #1a3a5c; padding: 8px 10px; text-align: left; font-weight: 600; }
        td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; }
        .btn-gestionar { background: #1a3a5c; color: #fff; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: .82rem; }
        .panel-gestionar { background: #fff; border: 2px solid #d4ac0d; border-radius: 10px; padding: 18px; margin-top: 18px; }
        .panel-gestionar h3 { color: #1a3a5c; margin-bottom: 12px; font-size: 1rem; }
        .acciones-gestionar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
        .sel-ganador { padding: 7px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: .88rem; }
        .sin-jornadas { background: #fff; border-radius: 10px; padding: 30px; text-align: center; color: #888; }
        .msg-ok    { background: #d5f5e3; color: #1e8449; padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; display: none; }
        .msg-error { background: #fadbd8; color: #c0392b; padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; display: none; }
    </style>
</head>
<body class="pagina-interna">

    <h2>Tablero de Control</h2>
    <div id="msgDiv" class="msg-ok"></div>

    <div id="sinJornadasDiv" class="sin-jornadas" style="display:none"></div>

    <div id="tableroDiv" style="display:none">

        <!-- Navegación de jornada -->
        <div class="nav-jornada">
            <button class="btn-nav" id="btnAnterior" onclick="navAnterior()">&#8592;</button>
            <span id="fechaJornada">—</span>
            <button class="btn-nav" id="btnSiguiente" onclick="navSiguiente()">&#8594;</button>
        </div>

        <!-- Stats -->
        <div class="stats-grilla">
            <div class="stat-card"><div class="stat-label">Total Apostado</div><div class="stat-valor" id="statApostado">—</div></div>
            <div class="stat-card"><div class="stat-label">Total Pagado</div><div class="stat-valor" id="statPagado">—</div></div>
            <div class="stat-card"><div class="stat-label">Comisiones</div><div class="stat-valor" id="statComision">—</div></div>
            <div class="stat-card" id="cardBalance"><div class="stat-label">Balance</div><div class="stat-valor" id="statBalance">—</div></div>
            <div class="stat-card"><div class="stat-label">Carreras</div><div class="stat-valor" id="statCantidad">—</div></div>
            <div class="stat-card"><div class="stat-label">Finalizadas</div><div class="stat-valor" id="statFinalizadas">—</div></div>
            <div class="stat-card"><div class="stat-label">Por correr</div><div class="stat-valor" id="statPorCorrer">—</div></div>
        </div>

        <!-- Próximas Carreras -->
        <div class="seccion-titulo">Próximas Carreras</div>
        <div id="proximasDiv"></div>

        <!-- Panel gestionar (se muestra al hacer click) -->
        <div id="panelGestionar" class="panel-gestionar" style="display:none">
            <h3 id="gestionarTitulo">Gestionar Carrera</h3>
            <div id="gestionarParticipaciones"></div>
            <div class="acciones-gestionar" id="gestionarAcciones"></div>
        </div>

        <!-- Carreras Finalizadas -->
        <div class="seccion-titulo">Carreras Finalizadas</div>
        <div id="finalizadasDiv"></div>

    </div>

    <script type="module">
        import dispatcher from './CommandDispatcher.js';

        let tableroData = null;
        let carreraSeleccionada = null;

        dispatcher.mapFunctions({
            tablero: (data) => { tableroData = data; renderTablero(data); },
            sinJornadas: (msg) => {
                document.getElementById('tableroDiv').style.display = 'none';
                document.getElementById('sinJornadasDiv').style.display = 'block';
                document.getElementById('sinJornadasDiv').textContent = msg;
            },
            mensaje: (msg) => mostrarMsg(msg, 'ok'),
            usuarioNoAutenticado: (url) => { window.parent.location.href = url; },
            nombreCompleto: (_) => {}
        }, { onException: (msg) => mostrarMsg(msg, 'error') });

        dispatcher.submit('/admin/tablero', {}, 'GET');

        function renderTablero(d) {
            document.getElementById('tableroDiv').style.display = 'block';
            document.getElementById('sinJornadasDiv').style.display = 'none';

            document.getElementById('fechaJornada').textContent = 'Jornada: ' + d.fechaJornada;
            document.getElementById('btnAnterior').disabled = !d.hayJornadaAnterior;
            document.getElementById('btnSiguiente').disabled = !d.hayJornadaSiguiente;

            document.getElementById('statApostado').textContent  = '$' + d.totalApostado.toFixed(2);
            document.getElementById('statPagado').textContent    = '$' + d.totalPagado.toFixed(2);
            document.getElementById('statComision').textContent  = '$' + d.totalComisiones.toFixed(2);
            document.getElementById('statBalance').textContent   = '$' + d.balance.toFixed(2);
            document.getElementById('statCantidad').textContent  = d.cantCarreras;
            document.getElementById('statFinalizadas').textContent = d.cantFinalizadas;
            document.getElementById('statPorCorrer').textContent = d.cantPorCorrer;

            const card = document.getElementById('cardBalance');
            card.className = 'stat-card ' + (d.balance >= 0 ? 'balance-pos' : 'balance-neg');

            renderProximas(d.carrerasProximas);
            renderFinalizadas(d.carrerasFinalizadas);

            // Si había una carrera seleccionada, re-renderizamos el panel con datos frescos
            if (carreraSeleccionada !== null) {
                const c = d.carrerasProximas.find(x => x.numero === carreraSeleccionada);
                if (c) mostrarGestionar(c); else ocultarGestionar();
            }
        }

        function renderProximas(lista) {
            const div = document.getElementById('proximasDiv');
            if (!lista || lista.length === 0) {
                div.innerHTML = '<p style="color:#888;font-size:.9rem;">No hay carreras próximas.</p>';
                return;
            }
            let html = '<table><thead><tr><th>N°</th><th>Nombre</th><th>Estado</th><th>Caballos</th><th>Total Apostado</th><th>Apuestas</th><th></th></tr></thead><tbody>';
            for (const c of lista) {
                html += `<tr>
                    <td>${c.numero}</td>
                    <td>${c.nombre}</td>
                    <td><span class="badge badge-${c.estado.toLowerCase()}">${c.estado}</span></td>
                    <td>${c.cantCaballos}</td>
                    <td>$${c.totalApostado.toFixed(2)}</td>
                    <td>${c.cantApuestas}</td>
                    <td><button class="btn-gestionar" onclick="seleccionarCarrera(${c.numero})">Gestionar</button></td>
                </tr>`;
            }
            html += '</tbody></table>';
            div.innerHTML = html;
        }

        function renderFinalizadas(lista) {
            const div = document.getElementById('finalizadasDiv');
            if (!lista || lista.length === 0) {
                div.innerHTML = '<p style="color:#888;font-size:.9rem;">No hay carreras finalizadas.</p>';
                return;
            }
            let html = '<table><thead><tr><th>N°</th><th>Nombre</th><th>Hora Fin.</th><th>Caballos</th><th>Total Apostado</th><th>Total Pagado</th><th>Ganador</th><th>Dividendo</th></tr></thead><tbody>';
            for (const c of lista) {
                html += `<tr>
                    <td>${c.numero}</td>
                    <td>${c.nombre}</td>
                    <td>${c.horaFinalizacion}</td>
                    <td>${c.cantCaballos}</td>
                    <td>$${c.totalApostado.toFixed(2)}</td>
                    <td>$${c.totalPagado.toFixed(2)}</td>
                    <td>${c.nombreGanador}</td>
                    <td>${c.dividendoFinalGanador}</td>
                </tr>`;
            }
            html += '</tbody></table>';
            div.innerHTML = html;
        }

        window.seleccionarCarrera = (numero) => {
            if (tableroData) {
                const c = tableroData.carrerasProximas.find(x => x.numero === numero);
                if (c) { carreraSeleccionada = numero; mostrarGestionar(c); }
            }
        };

        function mostrarGestionar(c) {
            document.getElementById('panelGestionar').style.display = 'block';
            document.getElementById('gestionarTitulo').textContent =
                `[${c.numero}] ${c.nombre} — ${c.estado} — Pozo: $${c.totalApostado.toFixed(2)}`;

            // Tabla de participantes
            let ptHtml = '<table style="margin-bottom:12px"><thead><tr><th>N°</th><th>Caballo</th><th>Dividendo</th><th>Total Apostado</th><th>Apuestas</th></tr></thead><tbody>';
            for (const p of c.participaciones) {
                const div = p.dividendoValido ? p.dividendo.toFixed(2) : 'S/E';
                ptHtml += `<tr><td>${p.numero}</td><td>${p.nombreCaballo}</td><td>${div}</td><td>$${p.totalApostado.toFixed(2)}</td><td>${p.cantidadApuestas}</td></tr>`;
            }
            ptHtml += '</tbody></table>';
            document.getElementById('gestionarParticipaciones').innerHTML = ptHtml;

            // Botones según estado
            let accionesHtml = '';
            if (c.estado === 'DEFINIDA') {
                accionesHtml = `<button class="btn btn-verde btn-sm" onclick="abrirCarrera(${c.numero})">Abrir Carrera</button>`;
            }
            if (c.estado === 'ABIERTA' || c.estado === 'ESTABLE') {
                if (c.estado === 'ESTABLE')
                    accionesHtml += `<button class="btn btn-naranja btn-sm" onclick="cerrarCarrera(${c.numero})">Cerrar Carrera</button>`;
                else
                    accionesHtml += `<button class="btn btn-naranja btn-sm" onclick="cerrarCarrera(${c.numero})">Cerrar Carrera</button>`;
            }
            if (c.estado === 'CERRADA') {
                let opts = '';
                for (const p of c.participaciones) opts += `<option value="${p.numero}">[${p.numero}] ${p.nombreCaballo}</option>`;
                accionesHtml += `
                    <label style="font-size:.85rem;font-weight:600;">Ganador:</label>
                    <select class="sel-ganador" id="selGanador">${opts}</select>
                    <button class="btn btn-oscuro btn-sm" onclick="finalizarCarrera(${c.numero})">Finalizar y Liquidar</button>`;
            }
            accionesHtml += `<button class="btn btn-sm" style="background:#eee;color:#555" onclick="ocultarGestionar()">Cerrar panel</button>`;
            document.getElementById('gestionarAcciones').innerHTML = accionesHtml;
            document.getElementById('panelGestionar').scrollIntoView({ behavior: 'smooth' });
        }

        window.ocultarGestionar = () => {
            carreraSeleccionada = null;
            document.getElementById('panelGestionar').style.display = 'none';
        };

        window.abrirCarrera = (num) => dispatcher.submit('/admin/abrir', { numeroCarrera: num });
        window.cerrarCarrera = (num) => dispatcher.submit('/admin/cerrar', { numeroCarrera: num });
        window.finalizarCarrera = (num) => {
            const sel = document.getElementById('selGanador');
            if (!sel) { mostrarMsg('Debe indicar el caballo ganador de la carrera', 'error'); return; }
            dispatcher.submit('/admin/finalizar', { numeroCarrera: num, numeroParticipacionGanadora: sel.value });
        };

        window.navAnterior  = () => dispatcher.submit('/admin/jornadaAnterior', {});
        window.navSiguiente = () => dispatcher.submit('/admin/jornadaSiguiente', {});

        function mostrarMsg(msg, tipo) {
            const d = document.getElementById('msgDiv');
            d.textContent = msg;
            d.className = tipo === 'ok' ? 'msg-ok' : 'msg-error';
            d.style.display = 'block';
            setTimeout(() => d.style.display = 'none', 4000);
        }
    </script>
</body>
</html>
